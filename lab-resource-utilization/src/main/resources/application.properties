spring.application.name=lab-resource-utilization
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:dh@rshini03}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8081
# ================== APP CONFIG ==================
app.name=Lab Resource Utilization
app.otp.expiry-seconds=300
app.base-url=http://localhost:5173
app.support-email=${APP_SUPPORT_EMAIL:priyadharshinimanikandan25@gmail.com}
# ================== MAIL CONFIG ==================
# SMTP Configuration - uses environment variables for production
# Expected environment variables on Render:
# MAIL_HOST=smtp-relay.brevo.com
# MAIL_PORT=2525
# MAIL_USERNAME=<your-brevo-login>
# MAIL_PASSWORD=<your-brevo-smtp-key>
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Properties (overridden by MailConfig bean for better control)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

spring.jackson.serialization.write-dates-as-timestamps=false
