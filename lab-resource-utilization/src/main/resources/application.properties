spring.application.name=lab-resource-utilization
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable data.sql seed file to run on startup
spring.sql.init.mode=never

server.port=8081
# ================== APP CONFIG ==================
app.name=Lab Resource Utilization
app.otp.expiry-seconds=300
app.base-url=http://localhost:8081
app.support-email=suroopasuroopa@gmail.com
# ================== MAIL CONFIG ==================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=suroopasuroopa@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
